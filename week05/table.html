<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/table.css">
    <title>Table</title>
</head>

<body>
    <table>
        <thead>
            <th>League</th>
            <th>Team</th>
            <th>Record</th>
            <th colspan="2">Player Count</th>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Southern</td>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr class="catarina">
                <td>Catarina</td>
                <td>49-24</td>
                <td>10</td>
            </tr>
            <tr>
                <td rowspan="3">Western</td>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr class="acre">
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Players</td>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
