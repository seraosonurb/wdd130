<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form>
            <div class="quiz-item box">
                <label for="q1" id="q1">What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2" id="q2">How are ID and Class attributes selected in
                    CSS?</label>
                <textarea name="q2" name="q2" id="q2" rows="2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3" id="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" name="q3" id="q3">
                    <option value="" selected disabled>Choose one..</option>
                    <option value="a">/*comment*/</option>
                    <option value="b">&lt;!-- comment --&gt;</option>
                    <option value="c">// comment</option>
                    <option value="d"># comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4" id="q4">What is the bottom margin given this
                    declaration?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Sumit Quiz for Grading</button>
        </form>
    </main>
</body>

</html>
