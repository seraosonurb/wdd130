<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Contact Us</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description"
      content="This is the the contact us page, where you can submit a form with any questions regarding our services. ">
    <meta name="author" content="Bruno da Silva Soares">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftinglogo.png" alt="Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html" target="_blank">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <div class="info">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street
                    Kolob, California
                    +1 999 999 9999
                    info@whitewater.com
                </p>
            </div>
            <div class="form">
                <form>
                    <div class="form-info">
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" required>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <fieldset class="form-purpose">
                        <legend>Message Purpose</legend>
                        <div class="radio-item">
                            <input type="radio" name="purpose" id="gi">
                            <label for="gi">General Inquiry</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" name="purpose" id="rq">
                            <label for="rq">Reservation Question</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" name="purpose" id="ws">
                            <label for="ws">Website Suggestion</label>
                        </div>
                    </fieldset>
                    <div class="form-message">
                        <label for="m">Message</label>
                        <textarea name="message" id="m" rows="3"
                          placeholder="Your message here!"></textarea>
                    </div>
                    <div class="subscription">
                        <input type="checkbox" name="subscribe" id="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                    <div class="button">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3475.4407941975273!2d-50.769234!3d-29.415910699999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9519244b947dc5bd%3A0x33008a8fdafb9fe!2sCentral%20Sul%20Raft!5e0!3m2!1spt-BR!2sbr!4v1770281369518!5m2!1spt-BR!2sbr"
                  width="400" height="570" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
        <h2>We are here to Serve You</h2>
        <section class="serve">

            <figure>
                <img src="images/employeethumpsup.jpg" alt="female employee with thumbs up">
                <figcaption>Madison Allen</figcaption>
            </figure>
            <figure>
                <img src="images/employeewithhat.jpg" alt="male employee with hat">
                <figcaption>Owen Amenta</figcaption>
            </figure>
            <figure>
                <img src="images/blondeemployee.jpg" alt="male blonde employee">
                <figcaption>Daniel Abraham</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>© White Water Rafting - Bruno da Silva Soares 2026</p>
        <nav class="socialmedia">
            <a href="generic"><img src="images/facebooklogo.svg" alt="Facebook icon black"
                  width="60"></a>
            <a href="generic"><img src="images/instagramlogo.svg" alt="Instagram icon black"
                  width="60"></a>
            <a href="generic"><img src="images/whatsapplogo.svg" alt="Whatsapp icon black"></a>
        </nav>
    </footer>
</body>

</html>
